<app-auth-shell
  heading="Set a new password"
  subheading="Choose something you haven't used before."
  art="glass-spiral"
  panelLead="Last step. A new password and you're straight back into"
  panelTail="."
>
  <form class="reset" (submit)="submit($event)" novalidate>
    @if (!resetToken()) {
      <p class="form-error" role="alert">
        <ng-icon name="solarDangerCircleBoldDuotone" aria-hidden="true" />Your reset session has
        expired. <a routerLink="/forgot-password">Request a new code</a>.
      </p>
    }
    @if (error()) {
      <p class="form-error" role="alert">
        <ng-icon name="solarDangerCircleBoldDuotone" aria-hidden="true" />{{ error() }}
      </p>
    }

    <label class="field"
      >New Password
      <span class="field__affix">
        <input
          #passwordInput
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Create a new password..."
          required
          (input)="passwordInput.setCustomValidity('')"
          (invalid)="setPasswordValidity(passwordInput)"
        />
        <button
          type="button"
          class="field__reveal"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <ng-icon
            [name]="showPassword() ? 'solarEyeClosedBoldDuotone' : 'solarEyeBoldDuotone'"
            aria-hidden="true"
          />
        </button>
      </span>
      <span class="field__hint">At least 8 characters.</span>
    </label>

    <label class="field"
      >Confirm New Password
      <input
        #confirmInput
        [type]="showPassword() ? 'text' : 'password'"
        name="confirmPassword"
        autocomplete="new-password"
        placeholder="Re-enter your new password..."
        required
        (input)="confirmInput.setCustomValidity('')"
        (blur)="checkPasswordsMatch(passwordInput, confirmInput)"
      />
    </label>

    <button
      type="submit"
      class="btn btn--primary btn--block"
      [disabled]="submitting() || !resetToken()"
    >
      {{ submitting() ? 'Saving…' : 'Save new password' }}
    </button>
  </form>
</app-auth-shell>
