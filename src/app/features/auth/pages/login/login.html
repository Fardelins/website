@let qrMode = mode() === 'qr';

<app-auth-shell
  [heading]="qrMode ? 'Log in with your phone' : 'Log in to your account'"
  [subheading]="
    qrMode
      ? 'Please scan the code with your app to log you in with ease.'
      : 'Welcome back. Let\'s pick up where you left off.'
  "
  art="glass-stack"
  panelLead="Your parcels kept moving. Pick up right where you left off with"
  panelTail="."
  [panelProof]="panelProof"
>
  <div #pane class="login__pane">
    @if (qrMode) {
      <div class="login">
        <app-qr-signin />

        <p class="form-divider"><span>or</span></p>

        <button type="button" class="btn btn--ghost btn--block" (click)="setMode('password')">
          <ng-icon name="solarKeyBoldDuotone" aria-hidden="true" />Log in with email instead
        </button>
      </div>
    } @else {
      <form class="login" (submit)="submit($event)" novalidate>
        @if (notice) {
          <p class="form-notice" role="status">{{ notice }}</p>
        }
        @if (error()) {
          <p class="form-error" role="alert">
            <ng-icon name="solarDangerCircleBoldDuotone" aria-hidden="true" />{{ error() }}
          </p>
        }

        <label class="field"
          >Email Address
          <input
            type="email"
            name="email"
            autocomplete="email"
            maxlength="254"
            placeholder="Enter your email address..."
            required
          />
        </label>

        <label class="field"
          >Password
          <span class="field__affix">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password..."
              required
            />
            <button
              type="button"
              class="field__reveal"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              <ng-icon
                [name]="showPassword() ? 'solarEyeClosedBoldDuotone' : 'solarEyeBoldDuotone'"
                aria-hidden="true"
              />
            </button>
          </span>
        </label>

        <a class="login__forgot" routerLink="/forgot-password">Forgot password?</a>

        <button
          type="submit"
          class="btn btn--primary btn--block"
          [disabled]="submitting() || googleSubmitting()"
        >
          {{ submitting() ? 'Logging in…' : 'Log In' }}
        </button>

        <p class="form-divider"><span>or</span></p>

        <div class="google-btn" [class.google-btn--busy]="googleSubmitting()">
          <span class="btn btn--ghost btn--block google-btn__face" aria-hidden="true">
            <img src="/auth/google.svg" alt="" width="18" height="18" />
            {{ googleSubmitting() ? 'Connecting…' : 'Continue with Google' }}
          </span>
          <div #googleButtonSlot class="google-btn__real"></div>
        </div>

        <button
          type="button"
          class="btn btn--ghost btn--block"
          [disabled]="submitting() || googleSubmitting()"
          (click)="setMode('qr')"
        >
          <ng-icon name="solarQRCodeBoldDuotone" aria-hidden="true" />Log in with QR code
        </button>

        <p class="form-note">I don't have an account yet? <a routerLink="/signup">Sign Up</a></p>
      </form>
    }
  </div>
</app-auth-shell>
