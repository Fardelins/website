@if (stage() === 'email') {
  <app-auth-shell
    heading="Forgot your password?"
    subheading="Enter your email and we'll send you a code to get back in."
    art="horizon"
    panelLead="Locked out? Two steps and you are back inside"
    panelTail="."
  >
    <form class="forgot" (submit)="requestOtp($event)" novalidate>
      @if (error()) {
        <p class="form-error" role="alert">
          <ng-icon name="solarDangerCircleBoldDuotone" aria-hidden="true" />{{ error() }}
        </p>
      }

      <label class="field"
        >Email Address
        <input
          type="email"
          name="email"
          autocomplete="email"
          maxlength="254"
          placeholder="Enter your email address..."
          required
        />
      </label>

      <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send code' }}
      </button>

      <p class="form-note">Remembered it? <a routerLink="/login">Back to log in</a></p>
    </form>
  </app-auth-shell>
} @else {
  <app-auth-shell
    heading="You've got a code!"
    subheading="We sent a {{ otpLength }}-digit code to {{ email() }}."
    art="horizon"
    panelLead="Locked out? Two steps and you are back inside"
    panelTail="."
  >
    <div class="forgot">
      @if (error()) {
        <p class="form-error" role="alert">
          <ng-icon name="solarDangerCircleBoldDuotone" aria-hidden="true" />{{ error() }}
        </p>
      }

      <app-otp-input [length]="otpLength" [status]="otpStatus()" (complete)="verifyOtp($event)" />

      <button
        type="button"
        class="btn btn--primary btn--block"
        [disabled]="(otp()?.code() ?? '').length < otpLength || otpStatus() === 'checking'"
        (click)="verifyOtp(otp()!.code())"
      >
        {{ otpStatus() === 'checking' ? 'Verifying…' : 'Verify code' }}
      </button>

      <p class="form-note">
        @if (cooldown() > 0) {
          You can request another code in {{ cooldown() }}s.
        } @else {
          Didn't get it?
          <button type="button" class="forgot__resend" [disabled]="resending()" (click)="resend()">
            {{ resending() ? 'Sending…' : 'Send code again' }}
          </button>
        }
      </p>
      <p class="form-note">
        <a routerLink="/forgot-password" (click)="useAnotherAddress()">Use a different email</a>
      </p>
    </div>
  </app-auth-shell>
}
