<div class="success">
  <span class="success__icon"
    ><ng-icon name="solarCheckCircleBoldDuotone" aria-hidden="true"
  /></span>
  <h2>Your delivery is booked</h2>
  <p>We've sent the details to your email. You'll get an update here each time the parcel moves.</p>

  @if (reference()) {
    <p class="success__id">
      <span>Payment reference</span>
      <strong>{{ reference() }}</strong>
    </p>
  }

  <div class="success__actions">
    <a class="btn btn--primary btn--block" routerLink="/app/deliveries">My parcels</a>
    <a class="btn btn--soft btn--block" routerLink="/app">Back to home</a>
  </div>
</div>
